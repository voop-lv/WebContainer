# Example sites. NOT loaded by Caddy: copy a block into /web/config/sites-enabled/<site>.conf, adjust, then
# `caddy validate --config /etc/caddy/Caddyfile` and `websrv --reload`.
#
# A site with a hostname gets automatic HTTPS from Caddy (certificate issued and renewed by Caddy itself,
# HTTP->HTTPS redirect included). Set `email` in /config/caddy/Caddyfile first. Certificates are stored in
# /web/caddy. To use a certbot certificate instead, see the last example.

# --- Static site --------------------------------------------------------------------------------------------
example.com, www.example.com {
	import general
	import security

	root * /web/data/example.com
	file_server

	# Access log (off by default). /var/log/caddy exists in the image.
	# log {
	# 	output file /var/log/caddy/example.com.log {
	# 		roll_size 50MiB
	# 		roll_keep 5
	# 	}
	# }
}

# --- PHP site on PHP 8.4 (php83_fastcgi / php85_fastcgi for the other shipped versions) ----------------------
php.example.com {
	import general
	import security

	root * /web/data/php.example.com/public
	import php84_fastcgi
	file_server
}

# --- Reverse proxy to an app on this container/host -----------------------------------------------------------
app.example.com {
	import general
	import security

	import proxy 127.0.0.1:3000
}

# --- Certificate from certbot (createLECert example.org) instead of Caddy's ACME ----------------------------
# `tls` with files turns Caddy's certificate management off for this site; the letsencrypt snippet keeps
# serving the HTTP-01 challenge so certbot can renew. health_check reports the cert when it expires.
http://example.org {
	import letsencrypt
	redir https://example.org{uri} permanent
}
example.org {
	import general
	import security
	tls /web/ssl/live/example.org/fullchain.pem /web/ssl/live/example.org/privkey.pem

	root * /web/data/example.org
	file_server
}
