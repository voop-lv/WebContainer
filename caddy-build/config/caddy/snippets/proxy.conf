# import proxy <upstream>      e.g.  import proxy 127.0.0.1:3000
# Reverse-proxy defaults. Caddy already forwards Host, sets X-Forwarded-For/-Proto/-Host and passes
# WebSocket upgrades through, so only the extras from the nginx image's proxy_params are added here.
(proxy) {
	# Caddy appends "Via: 1.1 Caddy" after header_down has run; a deferred site-level deletion removes it.
	header -Via

	reverse_proxy {args[0]} {
		header_up X-Real-IP {remote_host}

		# Don't leak upstream implementation details
		header_down -X-Powered-By
		header_down -Server

		transport http {
			dial_timeout 60s
			response_header_timeout 60s
		}
	}
}
