# Template: install.sh renders one copy per shipped PHP version (php84_fastcgi.conf, ...).
# import php{PHP_VERSION_NODOT}_fastcgi
# Put it after `root` and before `file_server`. Caddy's php_fastcgi already does try_files, index.php and
# resolves a symlinked root (same as nginx's $realpath_root).
(php{PHP_VERSION_NODOT}_fastcgi) {
	php_fastcgi unix//run/php/php{PHP_VERSION}-fpm.sock
}
