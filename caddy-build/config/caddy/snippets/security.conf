# import security
# Hardening headers plus a dotfile block. Same policy as the nginx image's security.conf.
(security) {
	header {
		X-Content-Type-Options "nosniff"
		X-Robots-Tag "none"
		Content-Security-Policy "frame-ancestors 'self'"
		X-Frame-Options "SAMEORIGIN"
		Referrer-Policy "strict-origin-when-cross-origin"
		# Browsers ignore HSTS over plain HTTP; add "preload" only once the domain is submitted to hstspreload.org.
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()"
		# Don't advertise the server software
		-Server
		-X-Powered-By
	}

	# dotfiles (.git, .env, .htaccess, ...) anywhere in the path, except ACME challenges
	@dotfiles {
		path */.*
		not path /.well-known/*
	}
	respond @dotfiles 403
}
