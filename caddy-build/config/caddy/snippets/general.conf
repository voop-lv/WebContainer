# import general
# Compression, static-asset caching and quieter access logs. Same policy as the nginx image's general.conf.
(general) {
	encode zstd gzip

	# assets, media: cache 7 days
	@static path *.css *.css.map *.js *.js.map *.jpg *.jpeg *.png *.gif *.ico *.cur *.heic *.webp *.tif *.tiff *.mp3 *.m4a *.aac *.ogg *.mid *.midi *.wav *.mp4 *.mov *.webm *.mpg *.mpeg *.avi *.ogv *.flv *.wmv
	header @static Cache-Control "public, max-age=604800"
	log_skip @static

	# svg, fonts: cache 7 days, allow cross-origin use
	@fonts path *.svg *.svgz *.ttf *.ttc *.otf *.eot *.woff *.woff2
	header @fonts {
		Cache-Control "public, max-age=604800"
		Access-Control-Allow-Origin "*"
	}
	log_skip @fonts

	@quiet path /favicon.ico /robots.txt
	log_skip @quiet
}
