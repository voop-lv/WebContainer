[program:webserver]
# Runs as root like the nginx master (reads certbot's root-only keys under /web/ssl, binds :80/:443 without
# depending on the container's unprivileged-port sysctl). Caddy's own certificates live in /web/caddy (Caddyfile).
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
