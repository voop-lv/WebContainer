services:
  webcontainer:
    image: vooplv/webcontainer:caddy
    tty: true
    stdin_open: true
    tmpfs:
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./web:/web"
      - "./config:/config"
      - "./scripts:/scripts"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
