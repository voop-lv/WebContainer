name: Build_Containers_AMD64
run-name: Build Containers AMD64 (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'core_files/**'
      - 'install/**'
      - 'nginx-build/**'
      - 'openresty-build/**'
      - 'Dockerfile'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  build_core_amd64:
    name: Build Core Container AMD64 (${{ github.ref_name }})
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      image_name: 'webcontainer'
      image_tag: ${{ github.ref_name }}
      type: 'core'
      runner: ubuntu-latest

  build_nginx_amd64:
    name: Build Nginx Container AMD64 (${{ github.ref_name }})
    needs: build_core_amd64
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      image_name: 'webcontainer'
      image_tag: ${{ github.ref_name }}
      type: 'nginx'
      runner: ubuntu-latest
      core_image: 'vooplv/webcontainer:core-${{ github.ref_name }}'

  build_openresty_amd64:
    name: Build Openresty Container AMD64 (${{ github.ref_name }})
    needs: build_core_amd64
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      image_name: 'webcontainer'
      image_tag: ${{ github.ref_name }}
      type: 'openresty'
      runner: ubuntu-latest
      core_image: 'vooplv/webcontainer:core-${{ github.ref_name }}'
