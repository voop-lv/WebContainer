name: Build Container Template

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      arch:
        description: 'Architecture the runner builds natively (amd64, arm64); suffix of the pushed tags'
        required: true
        type: string
      image_name:
        description: 'Local name of the Docker images to build (<name>:<type>-<tag>)'
        required: false
        type: string
        default: 'webcontainer'
      image_tag:
        description: 'Tag suffix for the Docker images'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Resolve image tag
        run: |
          TAG="${{ inputs.image_tag }}"
          # pull_request refs look like "18/merge"; docker tags cannot contain '/'
          TAG="${TAG//\//-}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Image tag: ${TAG} ($(uname -m), expected ${{ inputs.arch }})"

      # Core first, then nginx, openresty, caddy and apache on top of the local core image (no registry round-trip).
      - name: Build core and web server images
        id: build
        run: CI_TAG_OVERRIDE="${TAG}" CI_BASENAME_OVERRIDE="${{ inputs.image_name }}" bash .build/build-images.sh 2>&1 | tee build.log

      # The install scripts print "[ERROR] ..." / "[WARN] ..."; inside docker build output GitHub can't see them,
      # so lift them into annotations, the job summary and (for failed PR builds) a PR comment.
      - name: Report build errors and warnings
        if: ${{ !cancelled() }}
        env:
          ARCH: ${{ inputs.arch }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .build/report-build-issues.sh build.log

      # One comment per PR, edited in place on later failures; amd64 only, the arm64 run reports the same install errors.
      - name: Comment build failure on the PR
        if: ${{ failure() && steps.build.outcome == 'failure' && github.event_name == 'pull_request' && inputs.arch == 'amd64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body-file build-comment.md --edit-last --create-if-none \
            || echo "::warning title=PR comment::Could not comment on the PR (fork PRs get a read-only token)"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true

      - name: Scan images (fails on CRITICAL/HIGH)
        run: |
          mkdir -p trivy-results
          rc=0
          for type in core nginx openresty caddy apache; do
            trivy image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 \
              --format sarif --output "trivy-results/${type}.sarif" \
              "${{ inputs.image_name }}:${type}-${TAG}" || rc=1
          done
          exit $rc

      # One code-scanning category per image and architecture, so the two arch runs don't replace each other.
      - name: Upload Trivy results (core)
        if: ${{ !cancelled() && hashFiles('trivy-results/core.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/core.sarif
          category: trivy-core-${{ inputs.arch }}
      - name: Upload Trivy results (nginx)
        if: ${{ !cancelled() && hashFiles('trivy-results/nginx.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/nginx.sarif
          category: trivy-nginx-${{ inputs.arch }}
      - name: Upload Trivy results (openresty)
        if: ${{ !cancelled() && hashFiles('trivy-results/openresty.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/openresty.sarif
          category: trivy-openresty-${{ inputs.arch }}
      - name: Upload Trivy results (caddy)
        if: ${{ !cancelled() && hashFiles('trivy-results/caddy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/caddy.sarif
          category: trivy-caddy-${{ inputs.arch }}
      - name: Upload Trivy results (apache)
        if: ${{ !cancelled() && hashFiles('trivy-results/apache.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results/apache.sarif
          category: trivy-apache-${{ inputs.arch }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Per-arch tags (<type>-<tag>-<arch>); the calling workflow joins them into the multi-arch <type>-<tag>.
      - name: Push Docker images to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          for type in core nginx openresty caddy apache; do
            docker tag "${{ inputs.image_name }}:${type}-${TAG}" "vooplv/${{ inputs.image_name }}:${type}-${TAG}-${{ inputs.arch }}"
            docker push "vooplv/${{ inputs.image_name }}:${type}-${TAG}-${{ inputs.arch }}"
          done

      - name: Log out from Docker Hub
        if: github.event_name != 'pull_request'
        run: docker logout
