name: Build_Containers
run-name: Build Containers (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'core_files/**'
      - 'install/**'
      - 'nginx-build/**'
      - 'openresty-build/**'
      - 'caddy-build/**'
      - 'apache-build/**'
      - 'Dockerfile'
      - '.build/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'core_files/**'
      - 'install/**'
      - 'nginx-build/**'
      - 'openresty-build/**'
      - 'caddy-build/**'
      - 'apache-build/**'
      - 'Dockerfile'
      - '.build/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

# Each architecture builds natively on its own runner (no QEMU: OpenResty compiles from source) and pushes
# <type>-<tag>-<arch>. The publish job then joins both into the multi-arch <type>-<tag> that users pull.
jobs:
  build_amd64:
    name: Build Containers AMD64 (${{ github.ref_name }})
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      arch: amd64
      image_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

  # Disabled 2026-10-21: packages.sury.org has no patched arm64 PHP (CVE-2026-109618/109619) yet.
  # To re-enable: drop this `if`, add build_arm64 back to publish.needs and arm64 to publish's ARCHES.
  build_arm64:
    if: false
    name: Build Containers ARM64 (${{ github.ref_name }})
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      image_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

  publish:
    name: Publish multi-arch tags (${{ github.ref_name }})
    needs: [build_amd64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Create multi-arch manifests
        env:
          REF_TAG: ${{ github.ref_name }}
          ARCHES: amd64
        run: |
          TAG="${REF_TAG//\//-}"
          for type in core nginx openresty caddy apache; do
            image="vooplv/webcontainer:${type}-${TAG}"
            sources=()
            for arch in ${ARCHES}; do sources+=("${image}-${arch}"); done
            docker buildx imagetools create -t "${image}" "${sources[@]}"
            docker buildx imagetools inspect "${image}"
          done

      - name: Log out from Docker Hub
        if: always()
        run: docker logout
