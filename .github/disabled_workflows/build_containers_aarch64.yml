name: Build_Containers_AARCH64
run-name: Build Containers AARCH64 (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'core_files/**'
      - 'install/**'
      - 'nginx-build/**'
      - 'openresty-build/**'
      - 'Dockerfile'
      - '.build/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'core_files/**'
      - 'install/**'
      - 'nginx-build/**'
      - 'openresty-build/**'
      - 'Dockerfile'
      - '.build/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  build_aarch64:
    name: Build Containers AARCH64 (${{ github.ref_name }})
    uses: ./.github/workflows/build_container_template.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04-arm
      image_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
