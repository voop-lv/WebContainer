# Include snippets/security.conf
# Hardening headers plus a dotfile block. Same policy as the nginx image's security.conf.
# "onsuccess unset" drops a copy set by the PHP app or proxied upstream first, so each header is sent once with
# this value. CSP is left additive: browsers enforce every CSP header, so an app's own policy still applies.
Header onsuccess unset X-Content-Type-Options
Header always set X-Content-Type-Options "nosniff"
Header onsuccess unset X-Robots-Tag
Header always set X-Robots-Tag "none"
Header always set Content-Security-Policy "frame-ancestors 'self'"
Header onsuccess unset X-Frame-Options
Header always set X-Frame-Options "SAMEORIGIN"
Header onsuccess unset Referrer-Policy
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# Browsers ignore HSTS over plain HTTP; add "preload" only once the domain is submitted to hstspreload.org.
Header onsuccess unset Strict-Transport-Security
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header onsuccess unset Permissions-Policy
Header always set Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()"
# Don't advertise the app stack (PHP's own header is already off via expose_php)
Header always unset X-Powered-By
Header unset X-Powered-By

# dotfiles (.git, .env, .htaccess, ...) anywhere in the path, except ACME challenges
<LocationMatch "/\.(?!well-known/)">
	Require all denied
</LocationMatch>
