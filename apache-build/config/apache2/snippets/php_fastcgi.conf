# Template: install.sh renders one copy per shipped PHP version (php84_fastcgi.conf, ...).
# Include snippets/php{PHP_VERSION_NODOT}_fastcgi.conf
# Hands existing .php files to PHP {PHP_VERSION}-FPM; a missing .php file is a plain 404 (nginx: try_files ... =404).
# Front-controller apps (Laravel, Symfony, WordPress permalinks) also need:  FallbackResource /index.php
DirectoryIndex index.php index.html index.htm

<FilesMatch "\.php$">
	<If "-f %{REQUEST_FILENAME}">
		SetHandler "proxy:unix:/run/php/php{PHP_VERSION}-fpm.sock|fcgi://php{PHP_VERSION_NODOT}"
	</If>
</FilesMatch>
