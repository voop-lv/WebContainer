# Use proxy <upstream>      e.g.  Use proxy http://127.0.0.1:3000
# Reverse-proxy defaults (the nginx image's proxy_params). Defined once in apache2.conf; `Use` it inside a site.
# Apache already sets X-Forwarded-For/-Host/-Server; WebSocket upgrades pass through (upgrade=websocket).
<Macro proxy $upstream>
	# certbot's HTTP-01 challenges stay local (snippets/letsencrypt.conf)
	ProxyPass /.well-known/acme-challenge/ !
	ProxyPass / $upstream/ upgrade=websocket timeout=60
	ProxyPassReverse / $upstream/
	ProxyPreserveHost On

	RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
	RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
	RequestHeader set X-Forwarded-Port "expr=%{SERVER_PORT}"

	# Don't leak upstream implementation details
	Header unset X-Powered-By
	Header unset Server
	Header unset Via
</Macro>
