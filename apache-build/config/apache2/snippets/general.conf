# Include snippets/general.conf
# Static-asset caching and quieter access logs. Same policy as the nginx image's general.conf.
# gzip is server-wide (apache2.conf + mods-enabled/deflate.conf): AddOutputFilterByType inside a site would
# replace the global type list for that site instead of extending it.

# assets, media: cache 7 days
<FilesMatch "\.(?i:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv)$">
	Header set Cache-Control "public, max-age=604800"
</FilesMatch>

# svg, fonts: cache 7 days, allow cross-origin use
<FilesMatch "\.(?i:svgz?|ttf|ttc|otf|eot|woff2?)$">
	Header set Cache-Control "public, max-age=604800"
	Header set Access-Control-Allow-Origin "*"
</FilesMatch>

# keep assets, favicon and robots.txt out of the access log
SetEnvIfNoCase Request_URI "\.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?|ttf|ttc|otf|eot|woff2?)$" dontlog
SetEnvIf Request_URI "^/(?:favicon\.ico|robots\.txt)$" dontlog
