# Example sites. NOT loaded by Apache: copy a block into /web/config/sites-enabled/<site>.conf, adjust, then
# check with `. /etc/apache2/envvars && apache2 -t` and apply with `websrv --reload`.
# HTTPS certificates come from certbot: `createLECert example.com` (needs the site on :80 with the letsencrypt
# snippet first, or /cloudflare-account.ini for DNS validation).

# --- Static site --------------------------------------------------------------------------------------------
<VirtualHost *:80>
	ServerName example.com
	ServerAlias www.example.com
	DocumentRoot /web/data/example.com

	Include snippets/letsencrypt.conf
	Include snippets/general.conf
	Include snippets/security.conf
</VirtualHost>

# --- PHP site on PHP 8.4 (php83_fastcgi.conf / php85_fastcgi.conf for the other shipped versions) -------------
<VirtualHost *:80>
	ServerName php.example.com
	DocumentRoot /web/data/php.example.com/public

	Include snippets/letsencrypt.conf
	Include snippets/general.conf
	Include snippets/security.conf
	Include snippets/php84_fastcgi.conf
	# FallbackResource /index.php
</VirtualHost>

# --- Reverse proxy to an app on this container/host -----------------------------------------------------------
<VirtualHost *:80>
	ServerName app.example.com

	Include snippets/letsencrypt.conf
	Include snippets/security.conf
	Use proxy http://127.0.0.1:3000
</VirtualHost>

# --- HTTPS with a certbot certificate, HTTP redirected ---------------------------------------------------------
# Port 80 keeps serving the HTTP-01 challenge so certbot can renew; everything else is redirected.
# health_check reports the certificate if it expires or loses its renewal config.
<VirtualHost *:80>
	ServerName example.org
	Include snippets/letsencrypt.conf
	RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)$" "https://example.org/$1"
</VirtualHost>

<VirtualHost *:443>
	ServerName example.org
	DocumentRoot /web/data/example.org

	Protocols h2 http/1.1
	SSLEngine on
	SSLCertificateFile /web/ssl/live/example.org/fullchain.pem
	SSLCertificateKeyFile /web/ssl/live/example.org/privkey.pem

	Include snippets/general.conf
	Include snippets/security.conf
</VirtualHost>
