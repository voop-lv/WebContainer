# Main Apache config. Mounted at /etc/apache2 at container start (lazymount); edit here, then `websrv --reload`.
# Check a change first with:  . /etc/apache2/envvars && apache2 -t
# Sites live in /web/config/sites-enabled/*.conf (see sites.example.conf next to this file).

DefaultRuntimeDir ${APACHE_RUN_DIR}
PidFile ${APACHE_PID_FILE}
User ${APACHE_RUN_USER}
Group ${APACHE_RUN_GROUP}

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
HostnameLookups Off
# Fallback name for the main server (silences AH00558); each site sets its own ServerName.
ServerName localhost

ErrorLog ${APACHE_LOG_DIR}/error.log
LogLevel warn

IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
Include ports.conf

# --- Hardening -----------------------------------------------------------------------------------------------
# "Server: Apache" only (no version/OS), no version footer on error pages, no TRACE.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
AddDefaultCharset UTF-8
# Same upload limit as the nginx image (client_max_body_size 16M).
LimitRequestBody 16777216
# HTTP/1.1 by default: a global "h2" makes Apache send "Upgrade: h2" on every plain-HTTP response.
# HTTPS sites turn HTTP/2 on with `Protocols h2 http/1.1` (see sites.example.conf). install.sh also unlinks
# mods-enabled/http2.conf, which would set it globally again.
Protocols http/1.1

# gzip for every site: mods-enabled/deflate.conf covers html, plain, xml, css, js, rss; these complete the
# nginx image's gzip_types list.
AddOutputFilterByType DEFLATE application/json application/atom+xml image/svg+xml

# Nothing is served unless a <Directory> below grants it. No .htaccess, no directory listings.
<Directory />
	Options None
	AllowOverride None
	Require all denied
</Directory>

<Directory /web/data/>
	Options FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

# certbot HTTP-01 challenges (snippets/letsencrypt.conf)
<Directory /web/cert_webroot/>
	Options None
	AllowOverride None
	Require all granted
</Directory>

<FilesMatch "^\.ht">
	Require all denied
</FilesMatch>

# --- TLS: Mozilla "intermediate" ------------------------------------------------------------------------------
# No OCSP stapling: Let's Encrypt stopped running OCSP responders in 2025.
<IfModule ssl_module>
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
	SSLHonorCipherOrder off
	SSLSessionTickets off
	SSLSessionCacheTimeout 86400
</IfModule>

# --- Logging -------------------------------------------------------------------------------------------------
# Requests tagged "dontlog" (static assets, favicon, robots: snippets/general.conf) are skipped.
LogFormat "%v:%p %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog ${APACHE_LOG_DIR}/access.log vhost_combined env=!dontlog

# Macros used inside sites (`Use proxy ...`).
Include snippets/proxy.conf

# Sites from the shared volume. For hostnames no site claims, Apache answers with the first *:80 site in file
# order, so keep the catch-all named so it sorts first (the shipped one is default.conf).
IncludeOptional /web/config/sites-enabled/*.conf
