[program:webserver]
# apache2ctl does not exec the server, so supervisor would signal the wrapper shell; start the binary directly.
# Root master (binds :80/:443, reads certbot's root-only keys under /web/ssl), www-data workers (envvars).
command=/bin/bash -c '. /etc/apache2/envvars && mkdir -p "$APACHE_RUN_DIR" "$APACHE_LOCK_DIR" "$APACHE_LOG_DIR" && exec /usr/sbin/apache2 -D FOREGROUND'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
