# Default site: answers any hostname on plain HTTP with the landing page.
# Replace it (or move it to sites-disabled) once real sites exist; see /config/apache2/sites.example.conf.
<VirtualHost *:80>
	DocumentRoot /web/data/default_page
	DirectoryIndex index.html index.htm

	Include snippets/letsencrypt.conf
	Include snippets/general.conf
	Include snippets/security.conf
</VirtualHost>
