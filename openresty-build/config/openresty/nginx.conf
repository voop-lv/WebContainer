user  www-data;
worker_processes  auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # LuaRocks installs into /usr/local/openresty/luajit, which LuaJIT searches by default.
    # Add lua_package_path here only for modules outside that tree.

    include /web/config/sites-enabled/*.conf;

}
